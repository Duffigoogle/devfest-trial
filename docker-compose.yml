services:
  product:
    build:
      context: ./services/product
    ports:
      - "8081:8081"
    environment:
      - PORT=8081

  cart:
    build:
      context: ./services/cart
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - PRODUCT_URL=http://product:8081
    depends_on:
      - product

  payment:
    build:
      context: ./services/payment
    ports:
      - "8084:8084"
    environment:
      - PORT=8084

  notification:
    build:
      context: ./services/notification
    ports:
      - "8085:8085"
    environment:
      - PORT=8085

  order:
    build:
      context: ./services/order
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - PRODUCT_URL=http://product:8081
      - CART_URL=http://cart:8082
      - PAYMENT_URL=http://payment:8084
      - NOTIFICATION_URL=http://notification:8085
    depends_on:
      - product
      - cart
      - payment
      - notification

  frontend:
    build:
      context: ./services/frontend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PRODUCT_URL=http://product:8081
      - CART_URL=http://cart:8082
      - ORDER_URL=http://order:8083
    depends_on:
      - product
      - cart
      - order
