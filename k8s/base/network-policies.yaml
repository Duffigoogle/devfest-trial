apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cloudmart
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow Cart Service and GKE Gateway to reach Product Service (REST 3001 + gRPC 50051)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-product-service-ingress
  namespace: cloudmart
spec:
  podSelector:
    matchLabels:
      app: product-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cart-service
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 50051
---
# Allow Order Service and Frontend to reach Cart Service (REST 3002 + gRPC 50052)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cart-service-ingress
  namespace: cloudmart
spec:
  podSelector:
    matchLabels:
      app: cart-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: order-service
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 3002
        - protocol: TCP
          port: 50052
