syntax = "proto3";

package cloudmart.cart.v1;

service CartGrpcService {
  // Retrieves and locks an active shopping cart snapshot for Order Service checkout initiation.
  rpc GetAndLockCartSnapshot (GetAndLockCartSnapshotRequest) returns (CartSnapshotResponse);
}

message GetAndLockCartSnapshotRequest {
  string cart_id = 1;
  string user_id = 2;
  string correlation_id = 3;
}

message CartLineItemProto {
  string product_id = 1;
  string sku = 2;
  string product_name = 3;
  int64 unit_price_cents = 4;
  int32 quantity = 5;
}

message CartSnapshotResponse {
  string cart_id = 1;
  string user_id = 2;
  string status = 3;
  repeated CartLineItemProto items = 4;
  int64 total_cents = 5;
  string currency = 6;
}
