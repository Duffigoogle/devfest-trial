syntax = "proto3";

package cloudmart.product.v1;

service ProductCatalogGrpcService {
  // Validates a SKU exists, is active, has sufficient available stock, and returns current snapshot price.
  rpc ValidateProductSku (ValidateProductSkuRequest) returns (ValidateProductSkuResponse);
}

message ValidateProductSkuRequest {
  string product_id = 1;
  int32 requested_quantity = 2;
  string correlation_id = 3;
}

message ValidateProductSkuResponse {
  bool exists = 1;
  bool is_active = 2;
  bool has_sufficient_stock = 3;
  string product_id = 4;
  string sku = 5;
  string name = 6;
  int64 unit_price_cents = 7;
  int32 available_qty = 8;
}
