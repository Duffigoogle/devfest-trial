apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: cloudmart
  labels:
    app: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: order
          image: cloudmart/order
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: PORT
              value: "8083"
            - name: PRODUCT_URL
              value: "http://product:8081"
            - name: CART_URL
              value: "http://cart:8082"
            - name: PAYMENT_URL
              value: "http://payment:8084"
            - name: GOOGLE_CLOUD_PROJECT
              value: "PROJECT_ID"
            - name: PUBSUB_TOPIC
              value: "order.placed"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: cloudmart
  labels:
    app: order
spec:
  type: ClusterIP
  selector:
    app: order
  ports:
    - name: http
      port: 8083
      targetPort: 8083
