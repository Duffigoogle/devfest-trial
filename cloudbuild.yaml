# Google Cloud Build CI Pipeline for CloudMart Microservices
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

substitutions:
  _REGION: us-central1
  _AR_REPO: cloudmart-repo
  _DEPLOY_PIPELINE: cloudmart-gke-delivery

steps:
  # 1. Run Unit & Saga Contract Verification Tests
  - name: "node:20-alpine"
    id: "unit-and-saga-tests"
    entrypoint: "sh"
    args:
      - "-c"
      - "npm test"

  # 2. Build & Push All 6 Microservice Container Images to Google Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    id: "build-product-service"
    args:
      - "build"
      - "-f"
      - "apps/product-service/Dockerfile"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/product-service:${SHORT_SHA}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "build-cart-service"
    args:
      - "build"
      - "-f"
      - "apps/cart-service/Dockerfile"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/cart-service:${SHORT_SHA}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "build-order-service"
    args:
      - "build"
      - "-f"
      - "apps/order-service/Dockerfile"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/order-service:${SHORT_SHA}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "build-payment-service"
    args:
      - "build"
      - "-f"
      - "apps/payment-service/Dockerfile"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/payment-service:${SHORT_SHA}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "build-notification-service"
    args:
      - "build"
      - "-f"
      - "apps/notification-service/Dockerfile"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/notification-service:${SHORT_SHA}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "build-frontend"
    args:
      - "build"
      - "-f"
      - "apps/frontend/Dockerfile"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/frontend:${SHORT_SHA}"
      - "."

  # 3. Create Progressive Release in Google Cloud Deploy (Staging -> Manual Approval -> Canary Prod)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "trigger-cloud-deploy-release"
    entrypoint: "gcloud"
    args:
      - "deploy"
      - "releases"
      - "create"
      - "rel-${SHORT_SHA}"
      - "--delivery-pipeline=${_DEPLOY_PIPELINE}"
      - "--region=${_REGION}"
      - "--skaffold-file=skaffold.yaml"
      - "--images=product-service=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/product-service:${SHORT_SHA},cart-service=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/cart-service:${SHORT_SHA},order-service=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/order-service:${SHORT_SHA},payment-service=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/payment-service:${SHORT_SHA},notification-service=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/notification-service:${SHORT_SHA},frontend=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/frontend:${SHORT_SHA}"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/product-service:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/cart-service:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/order-service:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/payment-service:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/notification-service:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/frontend:${SHORT_SHA}"
