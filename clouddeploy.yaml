apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: cloudmart-gke-delivery
description: CloudMart Progressive Delivery Pipeline to GKE Autopilot (Staging -> Prod Canary)
serialPipeline:
  stages:
    - targetId: gke-staging
      profiles:
        - staging
    - targetId: gke-prod
      profiles:
        - prod
      strategy:
        canary:
          runtimeConfig:
            kubernetes:
              serviceNetworking:
                service: frontend
                deployment: frontend
          canaryDeployment:
            percentages: [25, 50]
            verify: true
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: gke-staging
description: CloudMart GKE Autopilot Staging Namespace
gke:
  cluster: projects/PROJECT_ID/locations/us-central1/clusters/cloudmart-autopilot-cluster
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: gke-prod
description: CloudMart GKE Autopilot Production Namespace (Requires Manual Approval)
requireApproval: true
gke:
  cluster: projects/PROJECT_ID/locations/us-central1/clusters/cloudmart-autopilot-cluster
