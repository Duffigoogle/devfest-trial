apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: cloudmart-external-gateway
  namespace: cloudmart
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        options:
          networking.gke.io/pre-shared-certs: cloudmart-managed-ssl-cert
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: cloudmart-http-route
  namespace: cloudmart
spec:
  parentRefs:
    - name: cloudmart-external-gateway
  hostnames:
    - "shop.cloudmart.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/products
      backendRefs:
        - name: product-service
          port: 3001
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/carts
      backendRefs:
        - name: cart-service
          port: 3002
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/orders
      backendRefs:
        - name: order-service
          port: 3003
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/payments/webhook
      backendRefs:
        - name: payment-service
          port: 3004
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 3000
